[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis"
version = "0.1.0"
description = "A bounded, opt-in desktop AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Hashir Rauf" },
    { name = "Hira Khalid" },
    { name = "Doureesha Batool" },
]

dependencies = [
    "watchdog>=4.0",
    "typer>=0.12",
    "rich>=13.0",
    "PySide6>=6.6",
    "gradio>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
artemis = "artemis.ui.cli:app"
artemis-panel = "artemis.ui.panel:launch"
artemis-web = "artemis.ui.web:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"
